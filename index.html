<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LEVEL UP</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="info-terms.js"></script>
<script>try{var t=localStorage.getItem("levelup-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<link rel="preload" href="fonts/juz40-regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/juz40-medium.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Weights one step lighter site-wide: regular & medium text use the regular file, bold text uses the medium file */
@font-face{font-family:"JUZ40";src:url("fonts/juz40-regular.woff2") format("woff2");font-weight:100 500;font-style:normal;font-display:swap}
@font-face{font-family:"JUZ40";src:url("fonts/juz40-medium.woff2") format("woff2");font-weight:600 900;font-style:normal;font-display:swap}
/* Layout: robot-lab console. Silver shell + dark visor panels, cyan "eye" glow as the single accent. Sidebar nav, one working column. */
:root{
  --bg:#EDF1F5; --surface:#FFFFFF; --surface-2:#E2E8EF; --ink:#13243A; --muted:#566880; --line:#CDD6E1;
  --visor:#0D2033; --visor-ink:#DDF7FC; --glow:#2CCFEA; --accent:#0A7A98; --on-accent:#FFFFFF;
  --ok:#17875A; --ok-bg:#DDF3E8; --warn:#A8650A; --warn-bg:#FBEBD2; --bad:#B83A33; --bad-bg:#F8E0DE;
  --dot:rgba(19,36,58,.07); --shadow:0 1px 2px rgba(19,36,58,.06),0 6px 20px rgba(19,36,58,.06);
  --f-display:"JUZ40",system-ui,sans-serif; --f-body:"JUZ40",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JUZ40",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08131F; --surface:#0F1F30; --surface-2:#152B42; --ink:#E4EDF6; --muted:#8DA1B7; --line:#21405D;
  --visor:#050E18; --visor-ink:#DDF7FC; --glow:#3FDDF4; --accent:#3FD3EE; --on-accent:#06202B;
  --ok:#4CD394; --ok-bg:#0F3326; --warn:#F0B055; --warn-bg:#3A2A10; --bad:#F27C73; --bad-bg:#3D1A18;
  --dot:rgba(63,221,244,.08); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08131F; --surface:#0F1F30; --surface-2:#152B42; --ink:#E4EDF6; --muted:#8DA1B7; --line:#21405D;
  --visor:#050E18; --visor-ink:#DDF7FC; --glow:#3FDDF4; --accent:#3FD3EE; --on-accent:#06202B;
  --ok:#4CD394; --ok-bg:#0F3326; --warn:#F0B055; --warn-bg:#3A2A10; --bad:#F27C73; --bad-bg:#3D1A18;
  --dot:rgba(63,221,244,.08); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
button,input,textarea,select{font-family:var(--f-body)}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;
  background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px);background-size:22px 22px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(1.35rem,3vw,1.8rem);font-weight:700}
h2{font-size:1.1rem;font-weight:500}
h3{font-size:.98rem;font-weight:500;font-family:var(--f-body);font-weight:600}
p{margin:0}
a{color:var(--accent)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-right:auto}
.brand svg{width:34px;height:38px}
.brand b{font-family:var(--f-display);font-weight:700;font-size:1.05rem;letter-spacing:.02em}
.brand small{display:block;font-family:var(--f-mono);font-size:.66rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:.78rem;font-weight:500;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.chip .led{width:7px;height:7px;border-radius:50%;background:var(--glow);box-shadow:0 0 6px var(--glow)}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}

/* layout */
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;max-width:1180px;margin:0 auto;
  padding-block:24px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;display:flex;flex-direction:column;gap:4px}
.side a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:500}
.side a:hover{background:var(--surface-2)}
.side a[aria-current="page"]{background:var(--visor);color:var(--visor-ink)}
.side a[aria-current="page"] .cnt{color:var(--glow)}
.side .cnt{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.side .sep{height:1px;background:var(--line);margin:8px 4px}
main{min-width:0;display:flex;flex-direction:column;gap:20px}
@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr);gap:16px;padding-top:12px}
  .side{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px;scrollbar-width:none}
  .side a{flex:0 0 auto;padding:7px 12px;border:1px solid var(--line);background:var(--surface)}
  .side .sep{display:none}
}

/* view head */
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.vhead > div:first-child{display:flex;flex-direction:column;gap:6px;min-width:0}
.vhead .lead{color:var(--muted);max-width:62ch}
.datectl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.datectl input{padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}

/* cards & forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.composer{display:grid;gap:12px;border-style:dashed;box-shadow:none;background:transparent}
.atts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.atts .btn{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stutabs{max-width:320px;margin:0 0 12px}
.composer .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.82rem;font-weight:500;color:var(--muted)}
.f input,.f textarea,.f select,input.t{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%;font-size:.95rem}
.f textarea{min-height:76px;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 14px;font-weight:500;cursor:pointer;text-decoration:none;font-size:.9rem;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.sm{padding:5px 10px;font-size:.8rem}
.btn.danger[data-armed]{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.list{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty svg{width:64px;height:72px;opacity:.9}
.banner{display:flex;gap:14px;align-items:center;background:var(--visor);color:var(--visor-ink);border-radius:var(--r);padding:16px 18px;flex-wrap:wrap}
.banner .big{font-family:var(--f-display);font-size:1.4rem;color:var(--glow)}
.banner .grow{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:2px}
.banner .muted{color:#9FB6CB}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.banner .bar{background:rgba(255,255,255,.12)}
.banner .bar i{background:var(--glow)}
.tag{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:1px solid currentColor;border-radius:6px;padding:1px 6px;text-decoration:none;white-space:nowrap}

/* tasks */
.ownbox{display:grid}.ownbox>summary{list-style:none;display:inline-flex;cursor:pointer;width:max-content}.ownbox>summary::-webkit-details-marker{display:none}
.ownbox[open]>summary{margin-bottom:10px}.chip.own{background:color-mix(in srgb,var(--sc,#17404E) 14%,transparent);color:var(--ink)}
.task{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
.task.is-done{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.tick{appearance:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;margin:0;transition:background .15s,border-color .15s}
.tick:checked{background:var(--ok);border-color:var(--ok)}
.tick:checked::after{content:"";width:8px;height:14px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
.tick:disabled{cursor:not-allowed}
.tbody{display:flex;flex-direction:column;gap:8px;min-width:0}
.thead{display:flex;gap:8px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.tdesc{color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.82rem;color:var(--muted)}
.proofs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.proof{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:4px 6px 4px 4px;background:var(--surface-2);font-size:.8rem;max-width:100%;min-width:0}
.proof img{width:38px;height:38px;object-fit:cover;border-radius:7px;display:block}
.proof .fic{width:38px;height:38px;border-radius:7px;background:var(--visor);color:var(--glow);display:grid;place-items:center;font-family:var(--f-mono);font-size:.65rem}
.proof a{color:var(--ink);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}
.proof button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:0 4px}
.upload{position:relative;overflow:hidden}
.upload input{position:absolute;inset:0;opacity:0;cursor:pointer}
.who{display:grid;gap:6px;margin-top:4px;border-top:1px solid var(--line);padding-top:10px}
.who-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.who-row .proofs{grid-column:1/-1}

/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.9rem}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--surface-2)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tr.open td{background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.mini{display:flex;align-items:center;gap:8px}
.mini .bar{width:70px}

/* checklists / tests */
.cl-items{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.cl-items label{display:flex;gap:10px;align-items:flex-start;padding:7px 4px;border-radius:8px;cursor:pointer}
.cl-items label:hover{background:var(--surface-2)}
.cl-items input{width:18px;height:18px;accent-color:var(--ok);margin-top:2px;flex:0 0 auto}
.cl-items .done span{text-decoration:line-through;color:var(--muted)}
.q{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.q:first-child{border-top:0}
.q > b{white-space:pre-line}
.qimg{max-width:100%;max-height:340px;border-radius:10px;border:1px solid var(--line);align-self:flex-start;background:#fff}
.qhint{font-size:.8rem}
.mrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mrow > span{min-width:120px;font-weight:600}
.mrow select{flex:1;min-width:200px;max-width:100%}
.opt{display:flex;gap:10px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.opt input{accent-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.qb{display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.qb .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.qb .opts label{display:flex;gap:8px;align-items:center}
.score{font-family:var(--f-display);font-size:1.6rem;color:var(--accent)}

/* robot */
.bot .bot-float{animation:float 4s ease-in-out infinite;transform-origin:center}
.bot .bot-eyes{animation:blink 5s infinite;transform-origin:100px 62px}
.bot .bot-shadow{animation:shadow 4s ease-in-out infinite;transform-origin:100px 222px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes shadow{0%,100%{transform:scaleX(1);opacity:.35}50%{transform:scaleX(.82);opacity:.22}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}

/* subject nav */
.side .navh{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:12px 12px 4px}
.side .sub{display:flex;flex-direction:column;gap:2px;margin:2px 0 6px 14px;padding-left:10px;border-left:2px solid var(--glow)}
.side .sub a{padding:6px 10px;font-weight:400;font-size:.9rem}
.side .sub a[aria-current="page"]{background:var(--surface-2);color:var(--ink);font-weight:500}
.side .sub a[aria-current="page"] .cnt{color:var(--accent)}
.side a.subj-on{background:var(--surface-2)}
.side .addsub{display:flex;gap:6px;padding:6px 4px}
.side .addsub input{flex:1;min-width:0;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills a{display:inline-flex;gap:6px;align-items:center;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-weight:500;font-size:.88rem}
.pills a[aria-current="page"]{background:var(--visor);color:var(--visor-ink);border-color:var(--visor)}
.pills .cnt{font-family:var(--f-mono);font-size:.72rem;opacity:.75}
@media (max-width:820px){ .side .sub,.side .navh,.side .addsub{display:none} }

/* corner robot greeting */
.greet{display:flex;align-items:center;gap:10px;margin-left:auto;border:0;background:none;cursor:pointer;padding:0;color:inherit;text-align:left}
.greet .gb{position:relative;background:var(--visor);color:var(--visor-ink);border-radius:14px;border-top-right-radius:4px;padding:7px 12px;max-width:260px;
  box-shadow:0 0 0 1px rgba(63,221,244,.25);animation:pop .5s ease-out both}
.greet .gb b{display:block;font-family:var(--f-display);font-weight:500;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.greet .gb small{display:block;color:#9FB6CB;font-size:.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.greet svg{width:44px;height:50px;flex:0 0 auto}
@keyframes pop{from{opacity:0;transform:translateX(8px) scale(.96)}to{opacity:1;transform:none}}
@media (max-width:520px){ .greet .gb small{display:none} .greet .gb{max-width:150px} }
.vmodal{position:fixed;inset:0;z-index:60;background:rgba(4,14,22,.78);display:grid;place-items:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.vmodal[hidden]{display:none}
.vbox{width:min(1000px,100%);max-height:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.vhead{display:flex;align-items:center;gap:8px;padding:10px 12px}
.vhead b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-display);font-weight:500}
.vframe{position:relative;background:#000}
.vframe.vvid{aspect-ratio:16/9}
.vframe.vdoc{height:calc(100dvh - 110px);overflow:auto;background:#525659;-webkit-overflow-scrolling:touch}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.vframe img{display:block;max-width:100%;margin:0 auto}
.vpage{background:#fff;margin:8px auto;width:calc(100% - 16px)}
.vpage canvas{display:block;width:100%;height:auto}
.vload{color:#fff;padding:24px;text-align:center}
/* global search */
.gsearch{position:relative;display:flex;align-items:center;height:42px;border-radius:13px;background:var(--surface);border:1px solid var(--line);padding:0 10px 0 36px;min-width:0;width:220px;transition:width .2s,border-color .2s}
.gsearch:focus-within{border-color:var(--accent);width:300px}
.gsearch > svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.gsearch input{border:0;background:transparent;outline:0;color:var(--ink);font:inherit;font-size:.92rem;width:100%;min-width:0;padding:0}
.gsearch input::-webkit-search-cancel-button{cursor:pointer}
.gres{position:absolute;top:calc(100% + 8px);right:0;width:min(440px,calc(100vw - 24px));max-height:min(70vh,520px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.22);z-index:45;padding:6px}
.gres[hidden]{display:none}
.gres .gi{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:10px;border-radius:11px;cursor:pointer;font:inherit}
.gres .gi:hover,.gres .gi.on{background:var(--surface-2)}
.gres .gi .gk{flex:0 0 auto;font-size:.7rem;padding:3px 7px;border-radius:7px;background:var(--surface-2);color:var(--muted);margin-top:2px}
.gres .gi b{display:block;font-weight:500;font-size:.92rem;line-height:1.35}
.gres .gi small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.gres .gi mark{background:color-mix(in srgb,var(--accent) 22%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.gres .gnone{padding:14px;color:var(--muted);font-size:.9rem}
.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,30%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--shadow)}}
@media (max-width:820px){ .gsearch{order:5;flex:1 1 100%;width:auto} .gsearch:focus-within{width:auto} .gres{left:0;right:auto;width:100%} }
.hpanel{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 74px);z-index:31;
  width:min(360px,calc(100vw - 32px));max-height:min(520px,calc(100vh - 110px));display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(10,30,50,.25);overflow:hidden}
.hpanel header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--visor);color:var(--visor-ink)}
.hpanel header svg{width:36px;height:40px}
.hpanel header b{font-family:var(--f-display);font-weight:500}
.hpanel header small{display:block;color:#9FB6CB;font-size:.75rem}
.hpanel header button{margin-left:auto;background:none;border:0;color:var(--visor-ink);font-size:1.3rem;cursor:pointer}
.hmsgs{padding:14px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;flex:1}
.msg{padding:9px 12px;border-radius:12px;max-width:90%;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.9rem}
.msg.bot{background:var(--surface-2);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--accent);color:var(--on-accent);align-self:flex-end;border-bottom-right-radius:4px}
.hform{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.msg.typing{opacity:.7;font-style:italic}
.hform input{flex:1;min-width:0;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.reg{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;background:var(--visor);color:var(--visor-ink);border-radius:var(--r);padding:20px}
.reg svg{width:110px;height:126px}
.reg h2{color:#fff}
.reg p{color:#BFD2E3}
.reg .f{color:#9FB6CB}
.reg .f input{background:#0F2A40;border-color:#2B5170;color:#fff}
.reg .btn.primary{background:var(--glow);border-color:var(--glow);color:#06202B}
.reg .err{color:#FFB4AC;font-size:.85rem}
@media (max-width:560px){ .reg{grid-template-columns:minmax(0,1fr)} .reg svg{width:80px;height:92px} }
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;max-width:calc(100vw - 32px)}
.preview-bar{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-weight:500}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* dark sidebar panel */
.side{background:#0D1826;border:1px solid #1C2E44;border-radius:18px;padding:10px 8px 14px;gap:2px;
  max-height:calc(100vh - 100px);overflow-y:auto;scrollbar-width:thin}
.side .navh{font-family:var(--f-body);font-size:.92rem;letter-spacing:0;text-transform:none;color:#7C8FA6;padding:16px 14px 8px;margin:0}
.side .navh:first-child{padding-top:8px}
.side a,.side .naddbtn{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:14px;color:#E3EBF4;font-weight:400;font-size:1rem;text-decoration:none}
.side .naddbtn{border:0;background:none;cursor:pointer;width:100%;text-align:left;font-family:inherit;color:#7C8FA6;font-size:.9rem;padding:8px 14px}
.side .naddbtn:hover{color:#E3EBF4}
.side a:hover{background:rgba(255,255,255,.06)}
.side .ni{width:22px;height:22px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side .nl{flex:1;min-width:0}
.side a[aria-current="page"],.side a.subj-on{background:rgba(63,221,244,.14);color:#5FE3F8}
.side a[aria-current="page"] .cnt{color:#5FE3F8}
.side .badge{min-width:26px;height:26px;padding:0 7px;border-radius:999px;background:#2CCFEA;color:#06202B;display:inline-grid;place-items:center;font-size:.8rem;font-weight:500;box-shadow:0 0 0 2px #0D1826,0 0 10px rgba(44,207,234,.45)}
.side .sub{margin:4px 0 8px 24px;padding-left:12px;border-left:1.5px solid #24425F}
.side .sub a{padding:8px 12px;font-size:.92rem;color:#B9C8D8;border-radius:10px}
.side .sub a[aria-current="page"]{background:rgba(255,255,255,.08);color:#FFFFFF;font-weight:500}
.side .sub .cnt{font-family:var(--f-mono);font-size:.72rem;color:#7C8FA6}
.side .nempty{color:#7C8FA6;padding:4px 14px;font-size:.85rem}
.side .addsub input{background:#13243A;border-color:#24425F;color:#fff}
@media (max-width:820px){
  .side{flex-direction:row;overflow-x:auto;max-height:none;padding:6px;border-radius:14px;gap:4px}
  .side .navh,.side .sub,.side .naddbtn,.side .addsub,.side .nempty{display:none}
  .side a{flex:0 0 auto;padding:8px 12px;gap:8px;font-size:.9rem;border:0;background:none}
  .side .ni{width:18px;height:18px}
  .side .badge{min-width:20px;height:20px;font-size:.7rem;padding:0 5px}
}
@media (max-width:560px){ .brand small{display:none} .top{gap:8px} .greet svg{width:36px;height:42px} }

/* standalone site */
html,body{margin:0}
body{font-size:15px}
img{max-width:100%}
.top{padding-top:calc(10px + env(safe-area-inset-top,0px))}
.authwrap{min-height:calc(100vh - 80px);display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.authcard{max-width:640px;width:100%}
.authtabs{display:flex;gap:4px;background:#0F2A40;border-radius:12px;padding:4px}
.authtabs button{flex:1;border:0;background:none;color:#9FB6CB;padding:8px;border-radius:9px;font-weight:500;cursor:pointer}
.authtabs button.on{background:var(--glow);color:#06202B}
.greet{margin-left:0}
#pills{display:none}
@media (max-width:820px){#pills{display:flex}}
.pills .addpill{border-style:dashed;color:var(--accent);background:transparent}
.themebtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:560px){.themebtn span{display:none}}
.bot{overflow:visible}
.bot.wave .bot-arm-r{transform-box:view-box;transform-origin:41px 118px;animation:wave 1.1s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(135deg)}50%{transform:rotate(168deg)}}
.hello{position:fixed;z-index:40;top:calc(env(safe-area-inset-top,0px) + 84px);right:max(16px,env(safe-area-inset-right,0px));width:min(420px,calc(100vw - 32px));
  display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:center;background:var(--visor);color:var(--visor-ink);border-radius:20px;padding:16px;
  box-shadow:0 0 0 1px rgba(63,221,244,.3),0 20px 50px rgba(10,30,50,.35);animation:helloIn .45s ease-out both}
.hello svg{width:110px;height:126px}
.hello h3{font-family:var(--f-display);font-weight:500;font-size:1.1rem;color:#fff;margin:0 0 6px}
.hello p{color:#BFD2E3;font-size:.92rem;margin:0 0 10px}
.hello .btn.primary{background:var(--glow);border-color:var(--glow);color:#06202B}
@keyframes helloIn{from{opacity:0;transform:translateY(-10px) scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.bot.wave .bot-arm-r{animation:none;transform:rotate(150deg)}}
.runstat{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);z-index:5;background:var(--surface);padding:8px 0}
.qwrap{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.qwrap:first-of-type{border-top:0}
.qwrap .q{border-top:0;padding:0}
.qwrap > .btn{align-self:flex-start}
.verdict{font-weight:600;margin:0}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.row2{grid-template-columns:1fr}}

body::before{background:var(--bg)}
h1{font-weight:700;letter-spacing:-.02em}
.eyebrow{letter-spacing:.14em;color:var(--soft);font-weight:600}

/* layout: sidebar | main | rail */
.layout{grid-template-columns:246px minmax(0,1fr) 286px;gap:24px;max-width:1630px;padding:23px 25px 60px;align-items:start}
.layout.norail{grid-template-columns:246px minmax(0,1fr);max-width:1400px}
.maincol{min-width:0;display:flex;flex-direction:column}
.sidebar{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:28px;position:sticky;top:23px;
  height:calc(100vh - 46px);min-height:560px;padding:24px 14px 16px;display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:thin}
.sidebar > .brand{padding:0 10px;margin:0 0 30px}
.brand b{font-size:1.15rem;font-weight:700;letter-spacing:-.02em}
.brand small{letter-spacing:.2em;color:var(--soft);font-weight:600;font-size:.62rem;margin-top:2px}
.brandMark svg{width:39px;height:39px;display:block}
.spacer{flex:1;min-height:16px}
.sidetip{background:linear-gradient(133deg,var(--hero-a),var(--hero-c));border-radius:18px;margin:0 3px 4px;padding:17px 15px}
.sidetip b{display:block;font-size:.9rem;line-height:1.4;color:var(--hero-ink)}
.sidetip p{font-size:.78rem;line-height:1.5;color:var(--hero-sub);margin:6px 0 11px}
.sidetip a{display:inline-block;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--accent);padding:8px 12px;font-size:.78rem;font-weight:700;text-decoration:none}

/* sidebar nav (light) */
.side{background:none;border:0;border-radius:0;padding:0;max-height:none;overflow:visible;position:static;gap:3px;align-items:stretch;align-self:stretch}
.side .navh{font-family:var(--f-body);font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--soft);padding:14px 14px 8px}
.side .navh:first-child{padding-top:0}
.side a,.side .naddbtn{gap:12px;padding:11px 14px;border-radius:14px;color:var(--nav-ink);font-weight:500;font-size:.95rem}
.side a:hover{background:var(--surface-2);color:var(--ink)}
.side .naddbtn{color:var(--soft);font-size:.86rem}
.side .naddbtn:hover{color:var(--accent)}
.side .ni{width:19px;height:19px;stroke-width:1.9}
.side a[aria-current="page"],.side a.subj-on{background:var(--nav-on);color:var(--accent);font-weight:700}
.side a[aria-current="page"] .cnt{color:var(--accent)}
.side .badge{min-width:22px;height:22px;padding:0 7px;background:var(--t1);color:var(--accent);box-shadow:none;font-size:.72rem;font-weight:700}
.side .sub{margin:2px 0 8px 23px;padding-left:12px;border-left:1.5px solid var(--line)}
.side .sub a{padding:7px 11px;font-size:.86rem;color:var(--nav-ink)}
.side .sub a[aria-current="page"]{background:var(--surface-2);color:var(--ink);font-weight:600}
.side .sub .cnt{color:var(--soft)}
.side .nempty{color:var(--soft)}
.side .addsub input{background:var(--surface);border-color:var(--line);color:var(--ink)}

/* top bar */
.top{position:static;background:transparent;border:0;padding:0!important;margin:2px 0 22px;min-height:50px;justify-content:flex-end;gap:10px}
.top > .brand{display:none;margin-right:auto}
.top .btn{height:42px;border-radius:13px;background:var(--surface);border:1px solid var(--line);color:var(--muted);padding:0 14px}
.top .btn:hover{color:var(--accent);border-color:var(--accent)}
.top .themebtn{width:42px;padding:0}
.greet .gb{background:var(--visor);color:var(--visor-ink);box-shadow:0 8px 18px rgba(23,64,78,.18);border-radius:14px;border-top-right-radius:4px}
.greet .gb small{color:color-mix(in srgb,var(--visor-ink) 70%,transparent)}
/* header NOVA: only the robot, frozen in place while scrolling */
.greet .gb{display:none}
.greet{width:44px;height:50px;flex:0 0 44px;justify-content:center}
#gBot{position:fixed;z-index:30;top:var(--nova-top,calc(env(safe-area-inset-top,0px) + 18px));right:var(--nova-right,max(16px,env(safe-area-inset-right,0px)));display:block;line-height:0;filter:drop-shadow(0 6px 10px rgba(23,64,78,.18))}
#gBot .bot-eyes{animation:blinkHi 3.6s infinite}
#gBot .bot-mouth{animation:smile 3.6s ease-in-out infinite;transform-origin:100px 75px}
@keyframes blinkHi{0%,40%,48%,84%,100%{transform:scaleY(1)}44%,88%{transform:scaleY(.1)}91%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes smile{0%,15%,65%,100%{transform:scale(1)}25%,55%{transform:scale(1.35,1.3)}}
@media (max-width:560px){ .greet{width:36px;height:42px;flex-basis:36px} }
@media (max-width:820px){ .top{align-self:stretch} .top .greet{margin-left:auto} }
@media (prefers-reduced-motion:reduce){ #gBot .bot-eyes,#gBot .bot-mouth{animation:none} }

/* surfaces */
.card{border-radius:21px;padding:20px 22px}
.composer{border-color:var(--line)}
.btn{border-radius:12px;font-weight:600}
.btn.primary{box-shadow:0 8px 18px rgba(23,64,78,.18)}
.f input,.f textarea,.f select,input.t,.datectl input{border-radius:12px;background:var(--surface)}
.bar{height:7px;background:var(--surface-2)}
.bar i{background:var(--prog)}
.tick{border-radius:8px;width:26px;height:26px}
.tick:checked{background:var(--prog);border-color:var(--prog)}
.tick:checked::after{width:7px;height:12px}
.banner{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:21px}
.banner .big{color:var(--accent)}
.banner .muted{color:var(--muted)}
.banner .bar{background:var(--surface-2)}
.banner .bar i{background:var(--prog)}
.tablewrap{border-radius:21px;box-shadow:var(--shadow)}
th{font-family:var(--f-body);font-weight:700;color:var(--soft)}
.empty{border-radius:21px;background:var(--surface)}
.tag{font-family:var(--f-body);font-weight:700;border-radius:8px;border:0;background:var(--t1);padding:3px 8px}
.chip{font-weight:600}
.pills a[aria-current="page"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.reg{border-radius:25px;background:linear-gradient(111deg,var(--visor),color-mix(in srgb,var(--visor) 80%,#2E816A))}
.reg p{color:color-mix(in srgb,var(--visor-ink) 78%,transparent)}
.reg .f{color:color-mix(in srgb,var(--visor-ink) 70%,transparent)}
.reg .f input{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#fff}
.reg .btn.primary,.hello .btn.primary{background:var(--glow);border-color:var(--glow);color:#0B2A33}
.authtabs{background:rgba(0,0,0,.2)}
.authtabs button{color:color-mix(in srgb,var(--visor-ink) 70%,transparent)}
.authtabs button.on{background:var(--glow);color:#0B2A33}
.stutabs{background:var(--surface-2)}
.stutabs button{color:var(--muted)}
.stutabs button.on{background:var(--accent);color:var(--on-accent)}
.toast{background:var(--visor);color:var(--visor-ink);border-radius:14px;box-shadow:0 15px 45px rgba(23,64,78,.25)}
.runstat{top:0}

/* home: hero, stats, subjects */
.hero{min-height:200px;position:relative;overflow:hidden;display:flex;align-items:center;border-radius:25px;padding:27px 30px;
  background:linear-gradient(111deg,var(--hero-a) 0%,var(--hero-b) 57%,var(--hero-c) 100%);border:1px solid var(--hero-line)}
.hero-content{position:relative;z-index:2;max-width:60%}
.eyebrow-pill{display:inline-flex;align-items:center;gap:7px;background:color-mix(in srgb,var(--surface) 70%,transparent);border-radius:999px;padding:6px 11px;color:var(--hero-ink);font-size:.7rem;font-weight:700;letter-spacing:.06em}
.eyebrow-pill i{height:6px;width:6px;border-radius:50%;background:var(--prog)}
.hero h2{font-weight:700;font-size:clamp(1.45rem,2.15vw,2.1rem);line-height:1.2;letter-spacing:-.02em;margin:14px 0 8px;color:var(--hero-ink)}
.hero p{font-size:.86rem;color:var(--hero-sub);line-height:1.6;max-width:360px;margin:0 0 16px}
.hero .btn.primary{background:var(--visor);border-color:var(--visor);color:#fff}
.hero-art{position:absolute;right:23px;top:50%;transform:translateY(-50%);width:250px;height:200px}
.hero-art .circle{position:absolute;right:30px;top:12px;height:176px;width:176px;border-radius:50%;background:var(--circle);
  box-shadow:0 0 0 18px color-mix(in srgb,var(--surface) 16%,transparent),0 0 0 36px color-mix(in srgb,var(--surface) 9%,transparent);display:grid;place-items:center}
.hero-art .circle svg{width:120px;height:138px}
.float-tag{position:absolute;padding:9px 13px;background:var(--surface);border-radius:13px;box-shadow:0 9px 25px rgba(23,64,78,.14);font-size:.76rem;font-weight:700;color:var(--hero-ink);white-space:nowrap}
.tag-one{top:20px;right:0;transform:rotate(9deg)}
.tag-two{bottom:20px;left:0;transform:rotate(-8deg);color:var(--ok)}
.sechead{display:flex;justify-content:space-between;align-items:center;margin:6px 0 -6px;gap:8px}
.sechead h3{font-size:1.05rem;font-weight:700;letter-spacing:-.01em}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.stat{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:19px;min-height:116px;padding:17px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-width:0}
.stat .st{display:flex;align-items:center;justify-content:space-between;gap:6px;color:var(--muted);font-size:.76rem;font-weight:600}
.stat .si{height:34px;width:34px;display:grid;place-items:center;border-radius:12px;flex:0 0 auto}
.stat .si svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.si.c1{background:var(--warn-bg);color:var(--warn)} .si.c2{background:var(--t1);color:var(--accent)} .si.c3{background:var(--ok-bg);color:var(--ok)}
.stat strong{font-size:1.7rem;letter-spacing:-.03em;font-weight:700;line-height:1}
.stat strong span{font-size:.82rem;letter-spacing:0;font-weight:600;color:var(--muted)}
.stat small{font-size:.72rem;color:var(--soft);font-weight:600}
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:13px}
.scard{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:19px;padding:17px;min-width:0;position:relative;overflow:hidden;
  text-decoration:none;color:var(--ink);transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column}
.scard:hover{transform:translateY(-3px);box-shadow:0 15px 26px rgba(23,64,78,.12)}
.scard .sic{height:44px;width:44px;display:grid;place-items:center;border-radius:14px;margin-bottom:14px;color:var(--accent);background:var(--t1)}
.scard:nth-child(3n+2) .sic{background:var(--t2);color:var(--ok)} .scard:nth-child(3n) .sic{background:var(--t3);color:var(--warn)}
.scard .sic .ni{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.scard b{font-size:.92rem;font-weight:700;margin-bottom:4px}
.scard p{font-size:.76rem;color:var(--muted);margin:0 0 12px}
.scard .bar{margin-top:auto;height:6px}
.scard .pct{position:absolute;right:16px;top:20px;color:var(--soft);font-size:.72rem;font-weight:700}

/* rail */
.rail{display:flex;flex-direction:column;gap:17px;position:sticky;top:23px}
.rbox{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:21px;padding:20px}
.rbox h3{font-size:.98rem;font-weight:700;margin-bottom:4px}
.rbox .lbl{color:var(--muted);font-size:.78rem;margin-bottom:14px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.week .wl{font-size:.64rem;color:var(--soft);margin-bottom:6px;font-weight:600}
.week button{height:34px;border:0;background:none;border-radius:11px;font-size:.8rem;font-weight:700;color:var(--ink);cursor:pointer;position:relative;padding:0}
.week button:hover{background:var(--surface-2)}
.week button.now{box-shadow:inset 0 0 0 1.5px var(--prog)}
.week button.sel{background:var(--visor);color:#fff}
.week button.done::after{content:"";position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--prog)}
.week button.sel.done::after{background:var(--glow)}
.upc{margin-top:16px;border-top:1px solid var(--line);padding-top:14px;display:flex;align-items:center;gap:10px;min-width:0}
.upc .ui{height:40px;width:40px;border-radius:12px;background:var(--warn-bg);display:grid;place-items:center;font-size:1.1rem;flex:0 0 auto}
.upc b{display:block;font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upc small{display:block;color:var(--muted);margin-top:3px;font-size:.74rem}
.upc > div{min-width:0}
.novacard{border-radius:22px;padding:18px;background:linear-gradient(138deg,var(--hero-a),var(--hero-c) 83%);border:1px solid var(--hero-line);position:relative;overflow:hidden}
.novacard::after{content:"✦";position:absolute;top:11px;right:17px;color:var(--prog);font-size:22px;opacity:.7}
.novacard .nic{height:46px;width:46px;border-radius:15px;background:var(--visor);display:grid;place-items:center;box-shadow:0 9px 17px rgba(23,64,78,.18)}
.novacard .nic svg{width:34px;height:38px}
.novacard h3{font-size:1rem;margin:12px 0 6px;color:var(--hero-ink)}
.novacard p{font-size:.8rem;color:var(--hero-sub);line-height:1.6;margin:0 0 14px}
.novacard .btn{background:var(--surface);border:0;color:var(--accent);box-shadow:0 4px 10px rgba(23,64,78,.08)}

@media (min-width:821px){ .side > a,.side .sub a{width:100%} }
.focus .fhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.focus .fhead h3{margin:0}
.fpill{font-size:.66rem;color:var(--ok);background:var(--ok-bg);border-radius:30px;padding:5px 10px;font-weight:700}
.fmain{display:flex;align-items:center;gap:15px;margin-top:14px}
.ring{--p:0%;height:93px;width:93px;border-radius:50%;background:conic-gradient(var(--prog) 0 var(--p),var(--surface-2) var(--p) 100%);padding:9px;display:grid;place-items:center;flex:0 0 auto}
.ring-in{width:100%;height:100%;background:var(--surface);border-radius:50%;display:grid;place-items:center}
.ring strong{font-size:1.25rem;letter-spacing:-.02em;font-weight:700}
.fcopy{min-width:0}
.fcopy b{font-size:.84rem}
.fcopy p{font-size:.74rem;color:var(--muted);line-height:1.5;margin:4px 0 10px}
.fcopy .btn{background:var(--t1);border:0;color:var(--accent)}
.fcopy .btn.running{background:var(--ok-bg);color:var(--ok)}
.factions .btn.ghost{background:var(--surface-2);color:var(--muted);padding:0;width:34px;height:32px;flex:0 0 34px;border-radius:10px}
.factions .btn.ghost:hover{background:var(--surface-2);color:var(--accent)}
.factions .btn.ghost svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.factions{margin-top:12px;flex-wrap:nowrap;gap:4px}
.factions #fBtn{flex:1 1 auto;background:var(--t1);border:0;color:var(--accent)}
.factions #fBtn.running{background:var(--ok-bg);color:var(--ok)}
.fpill.brk{background:var(--warn-bg);color:var(--warn)}
.ring.brk{background:conic-gradient(var(--warn) 0 var(--p),var(--surface-2) var(--p) 100%)}
.fset{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.fset .f input{padding:7px 9px}
.mtitle{color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.mtitle:hover{color:var(--prog)}.mtitle:hover .arr{transform:translate(2px,-2px)}
.mtitle .arr{font-size:.8em;color:var(--muted);transition:transform .15s}
.seen-tick{display:inline-flex;align-items:center;justify-content:center;padding:4px;cursor:pointer;user-select:none}
.seen-tick input{width:20px;height:20px;accent-color:var(--ok);margin:0}
.card.seen{opacity:.72}
.seen-head{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin:10px 0 0;font-weight:700;color:var(--muted)}
.seen-head::after{content:'';flex:1;border-top:1px solid var(--line)}
.mtitle .yt{display:inline-grid;place-items:center;width:28px;height:20px;border-radius:6px;background:#e62117;color:#fff;font-size:.62rem;flex:0 0 auto}
.stat.ubt .cd{display:flex;align-items:flex-start;justify-content:space-between;gap:2px}
.stat.ubt .cu{display:flex;flex-direction:column;align-items:center;min-width:0}
.stat.ubt .cu b{font-size:1.45rem;font-weight:700;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.stat.ubt .cu i{font-style:normal;font-size:.66rem;color:var(--soft);font-weight:600;margin-top:4px}
.stat.ubt .cs{font-size:1.2rem;font-weight:700;color:var(--muted);line-height:1.1}
.stat.ubt .cd-done{font-size:1rem}
.stat.rank{font:inherit;color:inherit;text-align:left;cursor:pointer;transition:transform .15s,box-shadow .15s}
.stat.rank:hover{transform:translateY(-2px);box-shadow:0 14px 26px rgba(23,64,78,.12)}
.stat.rank.top1{background:linear-gradient(135deg,var(--surface),var(--warn-bg));border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.stat.rank.top1 .si{background:var(--warn-bg);color:var(--warn)}
.rankbox .lb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.lb li{display:grid;grid-template-columns:32px minmax(0,1fr) auto 48px;gap:10px;align-items:center;padding:8px 10px;border-radius:12px}
.lb li:nth-child(odd){background:var(--surface-2)}
.lb li.me{box-shadow:inset 0 0 0 1.5px var(--prog)}
.lb li.gold .pl{background:var(--warn-bg);color:var(--warn)}
.lb .pl{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--t1);color:var(--accent);font-weight:700;font-size:.8rem}
.lb .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.lb .nm em{font-style:normal;color:var(--muted);font-weight:400}
.lb .gp{font-size:.78rem}
.lb b{text-align:right}
.si.fl svg{transform-origin:50% 90%}
.si.fl-0{background:var(--surface-2);color:var(--soft)}
.si.fl-1 svg{animation:flick 1.6s ease-in-out infinite}

.si.fl-3{background:linear-gradient(160deg,#FFE3B0,#FFC27A);color:#D2601A;box-shadow:0 0 14px rgba(242,140,40,.45)} .si.fl-3 svg{width:22px;height:22px;fill:rgba(255,170,60,.55);animation:flick .9s ease-in-out infinite}
.si.fl-4{background:linear-gradient(160deg,#FFD08A,#FF8A3D);color:#B33A0E;box-shadow:0 0 22px rgba(255,120,40,.65);width:40px;height:40px} .si.fl-4 svg{width:25px;height:25px;fill:rgba(255,220,120,.7);animation:flick .7s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.12) rotate(2deg)}}
/* mobile bottom bar */
.mbar{display:none}
@media (max-width:1370px){ .layout{grid-template-columns:223px minmax(0,1fr) 264px;gap:16px;padding:18px 18px 60px} .layout.norail{grid-template-columns:223px minmax(0,1fr)} .sidebar{top:18px;height:calc(100vh - 36px)} }

}

/* ---------- helpers ---------- */

const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const MONTHS = ['қаңтар','ақпан','наурыз','сәуір','мамыр','маусым','шілде','тамыз','қыркүйек','қазан','қараша','желтоқсан'];
const DAYS = ['жексенбі','дүйсенбі','сейсенбі','сәрсенбі','бейсенбі','жұма','сенбі'];

function fmtTime(ms){ const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtDT(ms){ const d = new Date(ms); return `${d.getDate()} ${MONTHS[d.getMonth()]}, ${fmtTime(ms)}`; }
function endOf(s){ const d = parseD(s); d.setHours(23,59,59,999); return d.getTime(); }
function dueOf(t){ return t && t.deadline ? t.deadline : endOf(t.date); }
function dueText(t){ const d = dueOf(t); return ymd(new Date(d)) === t.date ? fmtTime(d) : fmtDT(d); }

    ...S.checklists.map(c => ({ k:'Чек-лист', o:c, sec:c.section || 'checklists', hay:[c.title, (c.items || []).join(' '), c.file && c.file.name].join(' ') })),

  ];

function ytInfo(u){
  try {
    const x = new URL(u), h = x.hostname.replace(/^(www|m|music)\./, '');
    let id = '';
    if (h === 'youtu.be') id = x.pathname.slice(1).split('/')[0];
    else if (/(^|\.)youtube(-nocookie)?\.com$/.test(h)){
      id = x.searchParams.get('v') || (x.pathname.match(/^\/(?:embed|shorts|live|v)\/([^/?#]+)/) || [])[1] || '';
    }
    if (!/^[\w-]{6,20}$/.test(id)) return null;
    const t = x.searchParams.get('t') || x.searchParams.get('start') || '';
    let sec = 0; const mm = String(t).match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s?)?$/);
    if (mm) sec = (+mm[1] || 0) * 3600 + (+mm[2] || 0) * 60 + (+mm[3] || 0);
    return { id, sec };
  } catch { return null; }
}
function viewKind(u){

  if (!/^https?:$/.test(x.protocol)) return null;
  const yt = ytInfo(x.href); if (yt) return { k:'yt', ...yt };
  const h = x.hostname, path = decodeURIComponent(x.pathname).toLowerCase();
  let m;
  if (h === 'drive.google.com' && (m = x.pathname.match(/\/file\/d\/([\w-]+)/))) return { k:'frame', src:`https://drive.google.com/file/d/${m[1]}/preview` };
  if (h === 'drive.google.com' && x.searchParams.get('id')) return { k:'frame', src:`https://drive.google.com/file/d/${encodeURIComponent(x.searchParams.get('id'))}/preview` };
  if (h === 'docs.google.com' && (m = x.pathname.match(/^\/(document|presentation|spreadsheets)\/d\/([\w-]+)/))) return { k:'frame', src:`https://docs.google.com/${m[1]}/d/${m[2]}/preview` };
  if (/\.pdf$/.test(path)) return { k:'pdf', src:x.href };
  if (/\.(png|jpe?g|gif|webp|svg|avif)$/.test(path)) return { k:'img', src:x.href };
  if (/\.(docx?|pptx?|xlsx?)$/.test(path)) return { k:'frame', src:'https://view.officeapps.live.com/op/embed.aspx?src=' + encodeURIComponent(x.href) };
  return null;
}

function loadPdfJs(){

    sc.onerror = () => { pdfLib = null; no(new Error('pdf.js')); };

async function renderPdf(src, box, seq){

  try {
    const lib = await loadPdfJs();
    const doc = await lib.getDocument({ url:src }).promise;
    if (seq !== viewSeq) return;
    box.innerHTML = '';
    const dpr = Math.min(window.devicePixelRatio || 1, 2), W = box.clientWidth - 16;
    const io = new IntersectionObserver(es => es.forEach(async en => {
      if (!en.isIntersecting || en.target.dataset.done) return;
      en.target.dataset.done = 1; io.unobserve(en.target);

      const vp0 = pg.getViewport({ scale:1 }), vp = pg.getViewport({ scale:(W / vp0.width) * dpr });
      const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
      await pg.render({ canvasContext:c.getContext('2d'), viewport:vp }).promise;
      en.target.replaceChildren(c);
    }), { root:box, rootMargin:'800px 0px' });
    const first = await doc.getPage(1), r = first.getViewport({ scale:1 });
    for (let i = 1; i <= doc.numPages; i++){
      const d = document.createElement('div'); d.className = 'vpage'; d.dataset.p = i;
      d.style.aspectRatio = `${r.width} / ${r.height}`;
      box.appendChild(d); io.observe(d);

}

function tabCount(sid, tab){
  const sc = secs(sid).find(x => x.id === tab); if (!sc) return '';
  if (sc.kind === 'mat') return S.materials.filter(m => m.subject === sid && m.section === tab).length;
  if (sc.kind === 'check') return S.checklists.filter(c => c.subject === sid && (c.section || 'checklists') === tab).length;

}

function proofHtml(p, removable, tid){
  const url = fileUrl('proofs', p.path);
  const isImg = (p.type || '').startsWith('image/');
  const ext = (p.name || '').split('.').pop().slice(0,4).toUpperCase() || 'FILE';
  return `<span class="proof">${isImg ? `<a href="${esc(url)}" target="_blank" rel="noopener"><img src="${esc(url)}" alt=""></a>` : `<span class="fic">${esc(ext)}</span>`}<a href="${esc(url)}" target="_blank" rel="noopener" title="${esc(p.name)}">${esc(p.name || 'файл')}</a>${removable ? `<button data-act="rm-proof" data-t="${esc(tid)}" data-p="${esc(p.path)}" aria-label="Өшіру">×</button>` : ''}</span>`;
}
function statusChip(tp, task){
  if (tp && tp.done){
    const late = tp.doneAt && tp.doneAt > dueOf(task);
    return late ? `<span class="chip warn">Кешігіп орындалды · ${fmtTime(tp.doneAt)}</span>` : `<span class="chip ok">Орындалды${tp.doneAt ? ' · ' + fmtTime(tp.doneAt) : ''}</span>`;
  }
  if (Date.now() > dueOf(task)) return `<span class="chip bad">Орындалмады</span>`;
  return `<span class="chip">Күтілуде</span>`;
}
function taskTags(t){
  let h = '';
  const sn = t.subject ? secName(t.subject, t.section) : '';
  if (t.subject && subjName(t.subject)) h += `<a class="tag" href="#s-${esc(t.subject)}-${esc(sn ? t.section : ((secs(t.subject)[0] || {}).id || 'analysis'))}">${esc(subjName(t.subject))}</a>`;
  if (sn) h += `<span class="tag" style="color:var(--muted)">${esc(sn)}</span>`;
  return h;
}

function countdownText(){
  const m = MY(), now = Date.now();
  const left = pubTasks(S.date).filter(t => !m.tasks?.[t.id]?.done && dueOf(t) > now).sort((a, b) => dueOf(a) - dueOf(b));
  if (!left.length) return S.date < today() ? 'Бұл күннің мерзімі өтіп кетті.' : '';
  const t = left[0], ms = dueOf(t) - now;
  const h = Math.floor(ms / 3600000), mi = Math.floor(ms % 3600000 / 60000);
  return `Жақын дедлайн (${dueText(t)}): ${h} сағ ${mi} мин қалды`;
}
const UBT_AT = new Date('2027-01-11T08:00:00+05:00');
function ubtParts(){
  const now = new Date(), end = UBT_AT;
  if (now >= end) return null;
  let mo = 0;
  const addM = (d, m) => { const x = new Date(d); x.setMonth(x.getMonth() + m); return x; };
  while (addM(now, mo + 1) <= end) mo++;
  let ms = end - addM(now, mo);
  const dd = Math.floor(ms / 864e5); ms -= dd * 864e5;
  const hh = Math.floor(ms / 36e5); ms -= hh * 36e5;
  const mm = Math.floor(ms / 6e4);
  return [mo, dd, hh, mm];
}
function ubtHtml(){
  const p = ubtParts();
  if (!p) return '<b class="cd-done">ҰБТ басталды! Сәттілік! 🍀</b>';
  const L = ['Ай', 'Күн', 'Сағат', 'минут'];
  return p.map((v, i) => `<div class="cu"><b>${String(v).padStart(2, '0')}</b><i>${L[i]}</i></div>`).join('<span class="cs">:</span>');
}

// Сұрақ түрлері: бір жауап {answer}, бірнеше жауап {answers:[..]}, сәйкестендіру {left:[..], pairs:[..]}; img — сурет сілтемесі
const qKind = q => Array.isArray(q.pairs) ? 'match' : Array.isArray(q.answers) ? 'multi' : 'single';
const qHead = (q, qi) => `<b>${qi+1}. ${esc(String(q.q || '').replace(/^\s*\d+\s*[.)]\s*/, ''))}</b>${(q.img ? [].concat(q.img) : []).map(u => `<img class="qimg" src="${esc(u)}" alt="" loading="lazy">`).join('')}`;
const sameSet = (a, b) => Array.isArray(a) && Array.isArray(b) && a.length === b.length && [...a].sort().every((x, i) => x === [...b].sort()[i]);
function qRight(q, a){
  const k = qKind(q);
  if (k === 'multi') return sameSet(a, q.answers);
  if (k === 'match') return Array.isArray(a) && q.pairs.every((p, i) => a[i] === p);
  return a === q.answer;
}
function qRead(f, q, qi){
  const k = qKind(q);
  if (k === 'multi') return [...f.querySelectorAll(`input[name=q${qi}]:checked`)].map(c => +c.value).sort((x, y) => x - y);
  if (k === 'match') return q.left.map((_, li) => { const v = f.querySelector(`select[name=q${qi}_${li}]`)?.value; return v === '' || v == null ? -1 : +v; });
  const c = f.querySelector(`input[name=q${qi}]:checked`); return c ? +c.value : -1;
}
function qRun(q, qi, d){
  const k = qKind(q);
  if (k === 'match') return `<div class="q">${qHead(q, qi)}<span class="muted qhint">Әр жолға сәйкес жауапты таңдаңыз</span>${q.left.map((l, li) => `<label class="mrow"><span>${esc(l)}</span><select name="q${qi}_${li}" required><option value="">— таңдаңыз —</option>${q.options.map((o, oi) => `<option value="${oi}" ${Array.isArray(d) && d[li]===oi ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></label>`).join('')}</div>`;
  if (k === 'multi') return `<div class="q">${qHead(q, qi)}<span class="muted qhint">Бірнеше дұрыс жауап бар</span>${q.options.map((o, oi) => `<label class="opt"><input type="checkbox" name="q${qi}" value="${oi}" ${Array.isArray(d) && d.includes(oi) ? 'checked' : ''}> ${esc(o)}</label>`).join('')}</div>`;
  return `<div class="q">${qHead(q, qi)}${q.options.map((o, oi) => `<label class="opt"><input type="radio" name="q${qi}" value="${oi}" ${d===oi?'checked':''} required> ${esc(o)}</label>`).join('')}</div>`;
}
function qReview(q, qi, a){
  const k = qKind(q);
  if (k === 'match') return `<div class="q">${qHead(q, qi)}${q.left.map((l, li) => { const p = q.pairs[li], m = Array.isArray(a) ? a[li] : undefined;
    return `<div class="opt ${m === undefined || m === p ? 'right' : 'wrong'}"><b>${esc(l)}</b> → ${esc(q.options[p] ?? '')}${m !== undefined && m !== p ? ` <span class="muted">(сіз: ${esc(q.options[m] ?? '—')})</span>` : ''}</div>`; }).join('')}</div>`;
  const ok = k === 'multi' ? (oi => q.answers.includes(oi)) : (oi => oi === q.answer);
  const picked = k === 'multi' ? (oi => Array.isArray(a) && a.includes(oi)) : (oi => a === oi);
  return `<div class="q">${qHead(q, qi)}${q.options.map((o, oi) => `<div class="opt ${ok(oi) ? 'right' : (picked(oi) ? 'wrong' : '')}">${esc(o)}</div>`).join('')}</div>`;
}

S.testChecked = {}; S.mistRun = null; S.mistSubj = '';
function mistakeList(){
  const mm = MY().mistakes || {};
  return Object.entries(mm).map(([key, m]) => { const t = S.tests.find(x => x.id === m.t); const q = t && t.questions && t.questions[m.i]; return q ? { key, tid:m.t, i:m.i, at:m.at, q, test:t } : null; })
    .filter(Boolean).sort((a, b) => (a.at || 0) - (b.at || 0));
}
function runQs(id){
  if (id === '__mist') return (S.mistRun || []).map(k => { const [tid, i] = k.split(':'); const t = S.tests.find(x => x.id === tid); const q = t && t.questions && t.questions[+i]; return q ? { tid, i:+i, q, test:t } : null; }).filter(Boolean);
  const t = S.tests.find(x => x.id === id); return t ? (t.questions || []).map((q, i) => ({ tid:id, i, q, test:t })) : [];
}
function qBlock(id, it, qi){
  const d = (S.testDraft[id] || {})[qi], ck = (S.testChecked[id] || {})[qi];
  const src = id === '__mist' ? `<span class="muted qhint">${esc(subjName(it.test.subject))} · ${esc(it.test.title)}</span>` : '';
  if (ck){ const ok = qRight(it.q, d); return `<div class="qwrap ${ok ? 'is-ok' : 'is-bad'}" data-qi="${qi}">${src}${qReview(it.q, qi, d)}<p class="verdict ${ok ? 'ok' : 'bad'}">${ok ? '✓ Дұрыс!' : '✗ Қате. Дұрыс жауап жасылмен белгіленген.'}</p></div>`; }
  return `<div class="qwrap" data-qi="${qi}">${src}${qRun(it.q, qi, d)}${qKind(it.q) !== 'single' ? `<button type="button" class="btn sm" data-act="qcheck" data-t="${esc(id)}" data-qi="${qi}">Тексеру</button>` : ''}</div>`;
}
function runStat(id){
  const list = runQs(id), ck = S.testChecked[id] || {}, d = S.testDraft[id] || {};
  let ok = 0, bad = 0; list.forEach((it, qi) => { if (ck[qi]) (qRight(it.q, d[qi]) ? ok++ : bad++); });
  return `<span class="chip ok">Дұрыс: ${ok}</span><span class="chip bad">Қате: ${bad}</span><span class="chip">Қалды: ${list.length - ok - bad}</span>`;
}
function runForm(id, finishLabel, extra){
  const list = runQs(id);
  return `<form data-test="${esc(id)}" class="testrun"><div class="runstat" data-stat>${runStat(id)}</div>${list.map((it, qi) => qBlock(id, it, qi)).join('')}
    <div class="actions" style="margin-top:12px"><button class="btn primary" type="submit">${esc(finishLabel)}</button>${extra || ''}</div></form>`;
}
function noteMistake(it, ok){
  const my = S.preview ? S.previewMy : (S.my = S.my || { tasks:{}, checks:{}, tests:{} });
  my.mistakes = my.mistakes || {};
  const key = `${it.tid}:${it.i}`;
  if (ok){ if (!my.mistakes[key]) return; delete my.mistakes[key]; }
  else { if (my.mistakes[key]) return; my.mistakes[key] = { t:it.tid, i:it.i, at:Date.now() }; }
  renderNav();
  if (RO()) return;
  pendingWrites++;
  chain = chain.then(async () => {
    try { await q(sb.from('progress').upsert({ user_id:S.uid, data:S.my, updated_at:new Date().toISOString() })); }
    catch (e){ console.warn(e); toast('Сақталмады. Интернетті тексеріп, қайталап көр.'); }
    finally { pendingWrites--; }
  });
}
function checkQ(f, id, qi){
  const it = runQs(id)[qi]; if (!it) return;
  const a = qRead(f, it.q, qi), k = qKind(it.q);
  if (k === 'single' && a < 0) return;
  if (k === 'multi' && !a.length){ toast('Кемінде бір жауап таңда'); return; }
  if (k === 'match' && a.some(x => x < 0)){ toast('Барлық жолға жауап таңда'); return; }
  (S.testDraft[id] = S.testDraft[id] || {})[qi] = a;
  (S.testChecked[id] = S.testChecked[id] || {})[qi] = true;
  const w = f.querySelector(`.qwrap[data-qi="${qi}"]`); if (w) w.outerHTML = qBlock(id, it, qi);
  const st = f.querySelector('[data-stat]'); if (st) st.innerHTML = runStat(id);
  noteMistake(it, qRight(it.q, a));
}
/* ---------- терминология: тізім + флеш-карталар ---------- */
const TERMS = () => window.INFO_TERMS || { blocks:[], terms:[] };
const fcKey = () => `levelup-terms-${S.uid || 'anon'}`;
function fcKnown(){ if (!S.fcKnown || S.fcKnown.key !== fcKey()){ let a = []; try { a = JSON.parse(localStorage.getItem(fcKey()) || '[]') || []; } catch {} S.fcKnown = { key: fcKey(), set: new Set(Array.isArray(a) ? a : []) }; } return S.fcKnown.set; }
function fcSave(){ try { localStorage.setItem(fcKey(), JSON.stringify([...fcKnown()])); } catch {} }
function fcState(){ if (!S.fc) S.fc = { blk:'all', i:0, flip:false, rev:false, mix:false, order:null, q:'' }; return S.fc; }
function fcBuild(){
  const f = fcState(), known = fcKnown();
  let ids = TERMS().terms.filter(t => f.blk === 'all' ? true : f.blk === 'learn' ? !known.has(t.id) : t.b === f.blk).map(t => t.id);
  if (f.mix) for (let i = ids.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
  f.order = ids; f.i = 0; f.flip = false;
}
function renderTerms(){
  const box = $('#termsBox'); if (!box) return;
  const f = fcState(), D = TERMS();
  if (!f.order) fcBuild();
  if (!$('#fcBox', box)){
    box.innerHTML = `<section class="card fc" id="fcBox" aria-label="Флеш-карталар"></section>
      <section class="card" style="display:flex;flex-direction:column;gap:12px"><div class="tl-head"><h2>Барлық терминдер · ${D.terms.length}</h2><input class="t" id="termQ" type="search" placeholder="Терминді іздеу…" aria-label="Терминді іздеу" value="${esc(f.q)}"></div><div id="termList" class="list"></div></section>`;
  }
  renderFc(); renderTermList();
}
function renderFc(){
  const el = $('#fcBox'); if (!el) return;
  const f = fcState(), D = TERMS(), known = fcKnown(), total = D.terms.length;
  const nk = D.terms.filter(t => known.has(t.id)).length;

  const t = D.terms.find(x => x.id === f.order[f.i]);
  const front = t && (f.rev ? `<span class="def">${esc(t.d)}</span>` : `<span class="big">${esc(t.t)}</span>`);
  const back = t && (f.rev ? `<span class="big">${esc(t.t)}</span>${t.ex ? `<span class="ex">${esc(t.ex)}</span>` : ''}` : `<span class="def">${esc(t.d)}</span>${t.ex ? `<span class="ex">${esc(t.ex)}</span>` : ''}`);
  el.innerHTML = `<div class="thead"><h2>Флеш-карталармен жаттау</h2><span class="num muted">Меңгерілді: ${nk}/${total}</span></div>

    <div class="fc-ctl"><select id="fcBlk" aria-label="Блокты таңдау">${opts.map(([v, n]) => `<option value="${v}" ${f.blk === v ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>
      <button class="btn sm ${f.mix ? 'on' : ''}" data-act="fc-mix" aria-pressed="${f.mix}">Араластыру</button>
      <button class="btn sm ${f.rev ? 'on' : ''}" data-act="fc-rev" aria-pressed="${f.rev}">${f.rev ? 'Анықтама → термин' : 'Термин → анықтама'}</button>
      ${nk ? `<button class="btn sm ghost" data-act="fc-reset">Прогресті тазалау</button>` : ''}</div>
    ${t ? `<div class="fc-stage"><button type="button" class="fc-card ${f.flip ? 'flip' : ''}" data-act="fc-flip" aria-label="Картаны аудару">
        <span class="fc-face front"><span class="eyebrow">${esc(blkName(t.b))} · ${f.i + 1}/${f.order.length}</span>${front}${known.has(t.id) ? '<span class="chip ok">Білемін ✓</span>' : ''}<span class="hint">Басып аудар</span></span>
        <span class="fc-face back"><span class="eyebrow">${f.rev ? 'Термин' : esc(t.t)}</span>${back}<span class="hint">Басып аудар</span></span></button></div>
      <div class="fc-nav"><button class="btn" data-act="fc-go" data-d="-1" aria-label="Алдыңғы">‹</button><button class="btn" data-act="fc-mark" data-v="0">Қайталау керек</button><button class="btn primary" data-act="fc-mark" data-v="1">Білемін ✓</button><button class="btn" data-act="fc-go" data-d="1" aria-label="Келесі">›</button></div>
      <p class="muted" style="margin:0;font-size:.78rem;text-align:center">Пернетақта: бос орын — аудару, ← → — ауысу.</p>`
    : `<div class="fc-done">${f.blk === 'learn' ? 'Барлық терминді меңгердің! 🎉 Басқа блокты таңдап қайталай бер.' : 'Бұл блокта термин жоқ.'}</div>`}`;

function renderTermList(){
  const el = $('#termList'); if (!el) return;
  const f = fcState(), D = TERMS(), known = fcKnown();

  }).join('');

function fcGo(d){ const f = fcState(); if (!f.order.length) return; f.i = (f.i + d + f.order.length) % f.order.length; f.flip = false; renderFc(); }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act^="fc-"]'); if (!b) return;
  const f = fcState(), act = b.dataset.act;
  if (act === 'fc-flip'){ f.flip = !f.flip; const c = $('.fc-card'); if (c) c.classList.toggle('flip', f.flip); return; }
  if (act === 'fc-go'){ fcGo(+b.dataset.d); return; }
  if (act === 'fc-mark'){
    const id = f.order[f.i]; if (id == null) return;
    const k = fcKnown(); b.dataset.v === '1' ? k.add(id) : k.delete(id); fcSave();
    if (f.blk === 'learn' && b.dataset.v === '1'){ f.order.splice(f.i, 1); if (f.i >= f.order.length) f.i = 0; f.flip = false; renderFc(); }
    else fcGo(1);
    renderTermList(); return;
  }
  if (act === 'fc-mix'){ f.mix = !f.mix; fcBuild(); renderFc(); return; }
  if (act === 'fc-rev'){ f.rev = !f.rev; f.flip = false; renderFc(); return; }
  if (act === 'fc-reset'){
    if (!b.dataset.armed){ b.dataset.armed = '1'; b.textContent = 'Растайсың ба?'; setTimeout(() => { if (b.isConnected){ delete b.dataset.armed; b.textContent = 'Прогресті тазалау'; } }, 3500); return; }
    fcKnown().clear(); fcSave(); fcBuild(); renderFc(); renderTermList(); return;
  }
});

function studentStats(s){
  const p = S.progress[s.id] || {};
  const dayTasks = pubTasks(S.date);
  const dayDone = dayTasks.filter(t => p.tasks?.[t.id]?.done).length;
  const dayProof = dayTasks.filter(t => p.tasks?.[t.id]?.proofs?.length).length;
  const since = s.joinedAt ? ymd(new Date(s.joinedAt)) : '0000';

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'day'){ S.date = shiftDate(S.date, +b.dataset.d); syncDate(); return; }
  if (act === 'today'){ S.date = today(); syncDate(); return; }
  if (act === 'goto-day'){ S.date = b.dataset.d; syncDate(); return; }
  if (act === 'jump-tasks'){ const el = ROLE() === 'curator' ? $('#taskForm') : $('#taskList'); if (el) el.scrollIntoView({ behavior:'smooth', block:'start' }); return; }
  if (act === 'rank'){ S.showRank = !S.showRank; if (S.showRank && S.uid) loadRating().then(renderData).catch(() => {}); renderData(); return; }
  if (act === 'focus'){ toggleFocus(); return; }
  if (act === 'focus-reset'){ resetFocus(); return; }
  if (act === 'focus-edit'){ S.focus.edit = !S.focus.edit; renderRail(); if (S.focus.edit){ const i = $('#fStudy'); if (i) i.focus(); } return; }
  if (act === 'open-nova'){ const p = $('#hpanel'); p.hidden = false; renderHelper(); const i = $('#hq'); if (i && !i.closest('[hidden]')) i.focus(); return; }
  if (act === 'preview-off'){ setPreview(false); return; }
  if (act === 'add-subj'){ S.addingSubject = true; renderNav(); return; }
  if (act === 'add-sec'){ e.preventDefault(); S.secForm = 'add'; renderShell(); const i = $('#sName'); if (i) i.focus(); return; }
  if (act === 'ren-sec'){ S.secForm = 'ren'; renderShell(); const i = $('#rnName'); if (i) i.focus(); return; }
  if (act === 'sec-cancel'){ S.secForm = null; renderShell(); return; }
  if (act === 'del-sec'){
    if (!b.dataset.armed){ b.dataset.armed = '1'; const old = b.textContent; b.textContent = 'Ішіндегісімен бірге өшіру?'; setTimeout(() => { if (b.isConnected){ delete b.dataset.armed; b.textContent = old; } }, 3500); return; }
    const cs = curSec(); if (!cs) return;
    const list = secs(S.subject).filter(x => x.id !== cs.id);
    const tbl = cs.kind === 'mat' ? 'materials' : (cs.kind === 'check' ? 'checklists' : 'tests');
    await cur(async () => {
      if (cs.kind !== 'terms') await q(sb.from(tbl).delete().eq('subject', S.subject).eq('section', cs.id));
      if (cs.kind !== 'mat' && cs.id === secDef(cs.kind)) await q(sb.from(tbl).delete().eq('subject', S.subject).is('section', null));
      await q(sb.from('subjects').update({ sections: list.map(({ id, name, kind }) => ({ id, name, kind })) }).eq('id', S.subject));
    }, 'Бөлім өшірілді');
    location.hash = list[0] ? `s-${S.subject}-${list[0].id}` : `s-${S.subject}-none`;
    return;
  }
  if (act === 'toggle-task'){ S.openTasks[b.dataset.id] = !S.openTasks[b.dataset.id]; renderData(); return; }
  if (act === 'stu-tab'){ S.stuTab = b.dataset.v; renderData(); return; }
  if (act === 'open-stu'){ S.openStudent = S.openStudent === b.dataset.id ? null : b.dataset.id; renderData(); if (S.openStudent) $('#stuDetail').scrollIntoView({ behavior:'smooth', block:'start' }); return; }
  if (act === 'open-test'){ delete S.testChecked[b.dataset.id]; delete S.testDraft[b.dataset.id]; S.testOpen = S.testOpen === b.dataset.id ? null : b.dataset.id; renderData(); return; }
  if (act === 'add-q'){ addQ(); return; }
  if (act === 'qcheck'){ const f = b.closest('form'); if (f) checkQ(f, b.dataset.t, +b.dataset.qi); return; }
  if (act === 'mist-start'){ const l = mistakeList().filter(m => !S.mistSubj || m.test.subject === S.mistSubj); S.mistRun = l.map(m => m.key); S.testDraft.__mist = {}; S.testChecked.__mist = {}; renderData(); return; }
  if (act === 'mist-subj'){ e.preventDefault(); S.mistSubj = b.dataset.id || ''; renderData(); return; }
  if (act === 'rm-q'){ b.closest('.qb').remove(); renumberQ(); return; }
  if (act === 'del' || act === 'del-subj'){
    if (!b.dataset.armed){ b.dataset.armed = '1'; const old = b.textContent; b.textContent = act === 'del-subj' ? 'Пәнді өшіруді растау?' : 'Растау?'; setTimeout(() => { if (b.isConnected){ delete b.dataset.armed; b.textContent = old; } }, 3500); return; }
    if (act === 'del-subj'){ await cur(() => dbDelete('subjects', b.dataset.id), 'Пән өшірілді'); location.hash = 'plan'; return; }
    await cur(() => dbDelete(b.dataset.col, b.dataset.id), 'Өшірілді');
    return;
  }
  if (act === 'del-stu'){
    const st = S.students[b.dataset.id]; if (!st) return;
    if (!b.dataset.armed){ b.dataset.armed = '1'; const old = b.textContent; b.textContent = `${firstName(st.name)} толық өшірілсін бе? Растау`; setTimeout(() => { if (b.isConnected){ delete b.dataset.armed; b.textContent = old; } }, 4000); return; }
    b.disabled = true;
    const proofs = Object.values(S.progress[st.id]?.tasks || {}).flatMap(tp => (tp.proofs || []).map(p => p.path)).filter(Boolean);
    const files = S.own.filter(t => t.owner === st.id).flatMap(t => (t.attachments || []).map(a => a.path)).filter(Boolean);
    try {
      await q(sb.rpc('delete_student', { uid: st.id }));
      if (proofs.length){ try { await sb.storage.from('proofs').remove(proofs); } catch {} }
      if (files.length){ try { await sb.storage.from('materials').remove(files); } catch {} }
      S.openStudent = null; delete S.students[st.id]; delete S.progress[st.id];
      await loadAll(); toast(`${st.name} өшірілді`);
    } catch (e){
      console.warn(e); b.disabled = false;
      toast(/function|schema cache|does not exist|PGRST202/i.test(e && e.message || '') ? 'Алдымен Supabase-те 011_delete_student.sql іске қосыңыз.' : 'Өшірілмеді: ' + (e && e.message ? e.message : 'қате'), 8000);
    }
    renderData(); return;
  }
  if (act === 'publish-draft'){
    const d = S.drafts.find(x => x.id === b.dataset.id); if (!d) return;
    b.disabled = true;
    const { id, ...rest } = d;
    await cur(() => q(sb.from('tasks').update({ published:true, published_at:new Date().toISOString() }).eq('id', id)), 'Жарияланды: оқушылар көре алады');
    return;
  }
  if (act === 'rm-proof'){
    const tid = b.dataset.t, pid = b.dataset.p;
    const proofs = (MY().tasks?.[tid]?.proofs || []).filter(p => p.path !== pid);
    await writeMy({ tasks: { [tid]: { proofs } } });
    if (!RO()){ try { await sb.storage.from('proofs').remove([pid]); } catch {} }
    return;
  }
});

    const ck = S.testChecked[id] || {}, dr = S.testDraft[id] || {};
    const answers = t.questions.map((q, qi) => ck[qi] ? dr[qi] : qRead(f, q, qi));
    answers.forEach((a, qi) => { const k = qKind(t.questions[qi]); const answered = k === 'multi' ? (a && a.length) : k === 'match' ? (a && a.some(x => x >= 0)) : a >= 0; if (!ck[qi] && answered) noteMistake({ tid:id, i:qi }, qRight(t.questions[qi], a)); });
    const score = answers.filter((a, qi) => qRight(t.questions[qi], a)).length;
    S.testOpen = null; delete S.testDraft[id]; delete S.testChecked[id];
    await writeMy({ tests: { [id]: { score, total: t.questions.length, answers, at: Date.now() } } });
    toast(`Нәтиже: ${score}/${t.questions.length}`);
  }
});

function fillSecSelect(){ const sel = $('#tSec'), sj = $('#tSubj'); if (!sel || !sj) return; const v = sel.value; sel.innerHTML = `<option value="">Таңдалмаған</option>` + (sj.value ? secs(sj.value).map(x => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('') : ''); sel.value = v; }
function isDark(){ const t = document.documentElement.getAttribute('data-theme'); return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
function paintThemeBtn(){ const d = isDark(); $('#themeBtn').innerHTML = d
  ? '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
  : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>'; const lb = d ? 'Күндізгі режимге ауысу' : 'Түнгі режимге ауысу'; $('#themeBtn').setAttribute('aria-label', lb); $('#themeBtn').title = lb; }
$('#themeBtn').addEventListener('click', () => { const t = isDark() ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', t); try { localStorage.setItem('levelup-theme', t); } catch {} paintThemeBtn(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', paintThemeBtn);
paintThemeBtn();
function showHello(){
  if (S.role !== 'student' || !S.uid || S.preview) return;
  const key = 'levelup-hello-' + S.uid, d = today();
  try { if (localStorage.getItem(key) === d) return; localStorage.setItem(key, d); } catch {}
  const name = (S.me && (S.me.first || firstName(S.me.name))) || '';
  const box = document.createElement('div'); box.className = 'hello'; box.setAttribute('role', 'dialog'); box.setAttribute('aria-label', 'NOVA сәлемдесуі');
  box.innerHTML = `${bot('wave')}<div><h3>Сәлем${name ? ', ' + esc(name) : ''}!</h3><p>Күніңе сәттілік! Сенің қолыңнан келеді. 140 балл алуыңа тілектеспін!</p><button class="btn primary sm" type="button">Рахмет, NOVA!</button></div>`;
  document.body.appendChild(box);
  const close = () => { box.style.transition = 'opacity .3s'; box.style.opacity = '0'; setTimeout(() => box.remove(), 300); };
  box.querySelector('button').addEventListener('click', close);
  setTimeout(() => { if (box.isConnected) close(); }, 12000);
}
let qSeq = 0;
function addQ(){
  const box = $('#qBlocks'); if (!box) return;
  const k = ++qSeq;
  const d = document.createElement('div'); d.className = 'qb';
  d.innerHTML = `<div class="thead"><b class="qn"></b><button type="button" class="btn sm ghost" data-act="rm-q">Өшіру</button></div>
    <input class="t qq" id="qq${k}" placeholder="Сұрақ мәтіні" aria-label="Сұрақ мәтіні">
    <div class="opts">${[0,1,2,3].map(i => `<label><input type="radio" name="ans${k}" value="${i}" ${i===0?'checked':''} aria-label="Дұрыс жауап"><input class="t qo" id="qo${k}_${i}" placeholder="${String.fromCharCode(65+i)} нұсқасы"></label>`).join('')}</div>
    <p class="muted" style="font-size:.78rem">Дұрыс жауаптың сол жағындағы дөңгелекті белгілеңіз.</p>`;
  box.appendChild(d); renumberQ();
}
function renumberQ(){ document.querySelectorAll('#qBlocks .qn').forEach((el, i) => el.textContent = `${i+1}-сұрақ`); }

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
</script>
